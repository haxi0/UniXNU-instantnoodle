# Board description of the OnePlus 8 (instantnoodle, IN2010, SM8250), read by the unixnu build driver.
#
# Forked from UniXNU-pipa (xVanTuring), the Xiaomi Pad 6, the same SoC. The memory banks come from the phone's live
# device tree (/memory, read under Android), [userdata] from its GPT (sgdisk under recovery, 2026-10-22).

[board]
name = "instantnoodle"
soc = "SM8250"
description = "OnePlus 8"
kit = "instantnoodle"              # a package/ of this repository would appear as kits/instantnoodle in the build tree

# The same target OS image as UniXNU-sheng: the unchanged iPad7,1 iPadOS 17.7.11 restore image.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# Android's userdata (sda23 on the UFS LUN 0, 100.6 GiB, type 1B81E7E6-F50D-419B-A739-2AEEF8DA3335, unique
# 3C8DA6A4-5A87-56FB-C3F5-7BF373F8FD8F), from the phone's GPT; the UEFI's block I/O reports the same range. "unixnu
# build userdata" writes the image for it; flashing it erases what is there. The windows are those of UniXNU-sheng: the
# same target image.
[userdata]
first_lba = 0x3f13a8
last_lba = 0x1d19bfa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "instantnoodle_defconfig"
# Archive builders of the kernel step, in order; the ones instantnoodle_defconfig links. build-arm-driver.py is the generic
# driver builder of UniXNU-sheng.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-arm-driver.py NativeUfs --sm8250", # probe-only; --verified-root also requires an owner key and original storage ABI
  "build-native-aes-bindings.py",
  "build-libpthread-kernel.py",
  "build-link-stubs.py",
  "build-platform-power.py",
]

# The same original kernelcache and prelink selection as UniXNU-sheng: the target image is the same.
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The firmware is uefi-instantnoodle (a fork of uefi-sheng): instantnoodlePkg, Mu-Silicium's OnePlus 8T port (kebabPkg,
# Kona SM8250, the same 1080 x 2400 frame buffer) under the OnePlus 8's name, with its vendor drivers and ACPI tables,
# and UniXNU, the ramdisk block device driver and DarwinBoot added as in pipa. It reaches the UniXNU menu on the
# OnePlus 8 (fastboot boot, empty ramdisk, 2026-10-22).
[firmware]
config = "instantnoodle"           # Resources/Configs/instantnoodle.toml in the Mu-Silicium checkout (--uefi or UNIXNU_UEFI)
dsc = "Platforms/OnePlus/instantnoodlePkg/instantnoodle.dsc"
fd = "Build/instantnoodlePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-instantnoodle.py"]   # reads the checkout from UNIXNU_UEFI
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
# Masks a GIC interrupt that has no handler instead of taking it forever (found on sheng with a leftover IPCC interrupt).
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{uefi}/Platforms/Xiaomi",       # shengPkg: the ramdisk block device driver
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/OnePlus",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
# Off, as Mu-Silicium builds by default: with it on, SecurityStubDxe on kona never installs the
# Security Arch protocol, so DxeCore asserts (DxeMain.c:581) and DarwinBoot is never dispatched
# (OnePlus 8, 2026-10-22).
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "instantnoodle-research"

# Image parameters come from Resources/Configs/instantnoodle.toml of the checkout. Resources/DTBs/instantnoodle.dtb (the
# stock OxygenOS 11 boot image's tree, qcom,msm-id <0x164 0x20001>, which ABL matches) already carries
# /reserved-memory/cont_splash_region@9c000000, so no [[bootimg.dtb_node]] is added.

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and the optional
# trust cache and Data seed. DarwinBoot is part of the firmware volume.
#
# The kernel includes opt-in SM8250 storage probes and board hardware glue. It has
# no root publication, Data or display backend yet, so it cannot start iPadOS.
[payload]
volume = "NOODLEESP"
size_mib = 192
loader = "firmware"
title = "instantnoodle: source 4K XNU hardware bring-up"
timeout = 30                     # Keep the entry/error visible during initial hardware bring-up.
# 8 GB. The live tree's /memory has the banks 0x80000000+0x3bb00000, 0xc0000000+0xc0000000 and 0x180000000+0x100000000.
# XNU takes dram-base and dram-size as one range (is_dram_addr, which only picks the attribute of device mappings), so it
# spans from the base to the end of the last bank (0x280000000); every register block lies below 0x80000000.
dram_size = "0x200000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true                  # patch panic() screen output into the payload copy of the kernel
# The original static/System trust caches of the same IPSW, as accepted by UniXNU-sheng.
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
]
# The generic arguments of the sheng image that apply to this kernel. The display, HID, boot progress and sheng-*
# arguments belong to components instantnoodle_defconfig leaves out; armcpu-spi-ipi is an SM8550 quirk. sheng-pmgr=2 publishes
# the original PMGR nub through the bridge, which reads and writes no hardware.
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "armcpu-diagnostics=1",
  "sheng-smp=1", # ArmCpu requires this gate for the eight CPU nubs in the ADT
  "sheng-pmgr=2",
  # Load the original graphics family, then the no-display board hook. Hardware
  # remains off until instantnoodle-touch/buttons/cpufreq/autoreset is set explicitly.
  "offline-mobile-graphics-load=1",
  "offline-legacy-register=1",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
]

[payload.adt]
tool = "scripts/make-instantnoodle-adt.py"
chip_id = "8250"                     # software identity seed (with unique_chip_id) for IOPlatformUUID, not a silicon ID
# 4 GiB, as the iPad7,1. DarwinBoot takes the first free run of the firmware's map that holds it; Android finds
# 0xffc20000..0x27fffffff (6 GiB) free.
owned_memory_size = "0x100000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # the OS volume of the same IPSW
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository
